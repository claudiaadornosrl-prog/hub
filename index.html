  const CLODI = (tipo) => { const t = tipo === 'busto' ? 'busto' : 'cara', g = CLODI_IMG[t], im = (c, src) => `<img class="${c}" src="${src}" alt="" draggable="false">`;
    return `<span class="clodi clodi-${t}">` + (g.cuerpo ? im('clodi-cuerpo', g.cuerpo) : '') + `<span class="clodi-cabeza">` + im('clodi-base', g.cabeza)
      + im('clodi-int', g.interior) + im('clodi-man', g.mandibula) + im('clodi-ojos', g.ojos) + '</span></span>'; };

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const limpiar = (s) => String(s || '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim();

  function modulo() {
    const m = document.querySelector('meta[name="application-name"]');
    return limpiar((m && m.content) || document.title.split(/[·|–-]/)[0]) || 'Sistema';
  }

  /* (hub v60, 2-nov-2026) formatos de las otras 8 fichas: cada módulo con lo que le va a lo suyo */

  .sal-detalle { position: absolute; z-index: 9; left: 50%; top: calc(50% + 76px); transform: translateX(-50%); width: 320px; max-width: calc(100vw - 32px); padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 .5px var(--border), 0 20px 44px -16px rgba(0, 0, 0, .3); font-size: 12px; text-align: left; cursor: default; }
  .sal-detalle b { display: block; margin-bottom: 6px; font-size: 12.5px; }
  .sal-detalle ul { margin: 0 0 8px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .sal-detalle li { overflow-wrap: anywhere; }
  .sal-detalle li::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; background: var(--ok); }
  .sal-detalle li.mal { color: var(--mal); } .sal-detalle li.mal::before { background: var(--mal); }
  .sal-detalle span { font-size: 11px; color: var(--muted); }
  .sal-detalle a { color: var(--accent); cursor: pointer; }
  /* (hub v64) resuelto (por Claude o a mano) = verde; mientras Claude lo arregla, ámbar y sin la alarma */
  .medallon.salud.arreglando { --sal: var(--aviso); animation: none; }
  .sal-seg.res { stroke: var(--ok); opacity: .6; }
  .sal-detalle li.res { color: var(--muted); text-decoration: line-through; }
  .sal-nota { margin: 2px 0 10px; padding: 8px 10px; font-size: 11.5px; line-height: 1.4; overflow-wrap: anywhere; background: color-mix(in srgb, var(--n, var(--aviso)) 12%, var(--surface)); }
  .sal-nota.ok { --n: var(--ok); } .sal-nota.mal { --n: var(--mal); }
  .sal-acc { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 10px; }
  .sal-acc button { border: 0; cursor: pointer; font: inherit; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 9px 11px; }
  .sal-acc button:disabled { opacity: .5; cursor: default; }
  .sal-acc .si { background: var(--boton); color: var(--boton-txt); }
  .sal-acc .no { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--border); }
  .sal-arreglos { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow: auto; margin-bottom: 10px; }
  .sal-arr { padding-left: 9px; border-left: 2px solid var(--ok); font-size: 11.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .sal-arr.mal { border-left-color: var(--mal); }
  .sal-arr b { display: block; margin: 0; font-size: 10px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  /* Sin fichas (celular, locales, ventana angosta): el saludo en el medio, y el health check debajo (JP) */
  .cel-centro { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cel-centro .s1 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; line-height: 1.1; }
  .cel-centro .s2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cel-centro .s3 { font-size: 11.5px; color: var(--accent); margin-top: 12px; }
  .cel-centro .medallon { position: relative; left: auto; top: auto; transform: none; margin-top: 16px; }
  .cel-centro .sal-detalle { top: calc(100% + 10px); }
  .escena.chico .cel-centro .s1 { font-size: 19px; }
  .escena.chico .cel-centro .s2 { font-size: 11px; }
  .escena.chico .cel-centro .medallon.salud { width: 116px; height: 116px; }
  /* Título: florece una vez al abrir (los rayos del asterisco aparecen de a uno y las letras suben) y queda quieto */
  .wordmark .l { display: inline-block; animation: letra .55s cubic-bezier(.2, .7, .3, 1) both; animation-delay: calc(.65s + var(--i) * 45ms); }
  .wordmark rect { animation: asoma .3s ease-out both; animation-delay: calc(var(--r) * 55ms); }
  @keyframes letra { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } }
  @media (prefers-reduced-motion: reduce) {
    .fz, .fz *, .medallon, .medallon *, .wordmark, .wordmark * { animation: none !important; }
  }
  /* ── (hub v62) estilo atelier: lo que cambia sobre las reglas de arriba (tipografías, esquinas rectas, mayúsculas espaciadas) ── */
  .container { border-radius: 0; border-color: transparent; background: transparent; }   /* JP: "todo el fondo color arena" */
  .wm-claude { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 58px; letter-spacing: 0; }
  body.con-tablero .wm-claude { font-size: 40px; }
  .wordmark .aster { fill: var(--aster); }
  .subtitle { font-size: 10.5px; letter-spacing: .24em; text-transform: uppercase; }
  /* botones de arriba: solo el ícono, sin recuadro (regla de diseño de JP) */
  .config-btn { background: transparent; border: 0; box-shadow: none; border-radius: 0; color: var(--muted); font-size: 19px; }
  .config-btn:hover { color: var(--text); background: color-mix(in srgb, var(--text) 6%, transparent); }
  .install-btn { border-radius: 0; background: transparent; box-shadow: none; font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
  .install-btn:hover { transform: none; box-shadow: none; background: color-mix(in srgb, var(--text) 5%, transparent); }
  /* paneles (módulos visibles, notificaciones, mi cuenta) */
  .config-overlay { background: rgba(28, 22, 18, .42); }
  .config-panel { border-radius: 0; padding: 26px 24px 22px; box-shadow: 0 24px 60px -20px rgba(28, 22, 18, .45); }
  .config-panel h3 { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 500; margin-bottom: 8px; }
  .config-row .nombre { font-size: 14px; }
  .config-cerrar { border-radius: 0; font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; padding: 13px; }
  .notif-switch { border-radius: 0; background: color-mix(in srgb, var(--conejo) 35%, var(--surface)); }
  .notif-switch::after { border-radius: 0; box-shadow: none; }
  .notif-switch.on::after { background: var(--boton-txt); }
  .notif-login input { border-radius: 0; }
  .notif-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .notif-user a { font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .footer { font-size: 10.5px; letter-spacing: .06em; }
  /* monedas: cara de cerámica en el tono del módulo, ícono crema; el nombre en mayúsculas chiquitas */
  .cara { color: var(--ic); }   /* el ícono: crema sobre los tonos de tierra; oscuro sobre los tonos claros del modo oscuro */
  .nom { font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; width: 108px; }
  .escena.chico .nom { font-size: 8.5px; width: 86px; }
  .arco { stroke: var(--beige); }
  /* fichas */
  .fz { background: color-mix(in srgb, var(--c) 7%, var(--surface)); }
  .q-tl { border-radius: 110px 0 0 0; } .q-tr { border-radius: 0 110px 0 0; }
  .q-bl { border-radius: 0 0 0 110px; } .q-br { border-radius: 0 0 110px 0; }
  .fz-ic, .notif-ic { color: var(--ic); }
  .fz-t { font-size: 11px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase; }
  .fz-abrir { font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .fz-abrir:hover { color: var(--text); }
  .fz-lbl { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
  .fz-num { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500; line-height: 1; margin: 2px 0; }
  .h-sub { font-size: 9px; letter-spacing: .2em; }
  .tb-pill, .chips span, .fz-pills span, .ag-dia, .kb, .cal-d, .sal-detalle, .selector, .sel-op, .fz-esq .sk, .pers.tarde::after { border-radius: 0; }
  .meta-barra, .mb-fill, .mb-extra, .br-pista, .br-pista i, .compo, .db-barras i { border-radius: 0; }
  .leyenda span::before { border-radius: 0; }
  .kb b, .cal-dia { font-family: 'Cormorant Garamond', serif; font-weight: 500; }
  .kb b { font-size: 26px; line-height: 1.05; }
  .cal-dia { font-size: 28px; line-height: 1.1; }
  .cal-mes { color: var(--ic); letter-spacing: .18em; }
  .sel-bola { color: var(--ic); }
  .md-fecha { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 500; }
  .medallon .aster { fill: var(--aster); }
  .sal-t { font-size: 8.5px; letter-spacing: .2em; }
  .sal-e { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 500; }
  .cel-centro .s1 { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 500; }
  .cel-centro .s2 { font-size: 10px; letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; }
  .cel-centro .s3 { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .escena.chico .cel-centro .s1 { font-size: 27px; }
  @media (max-width: 540px) {
    .container { padding: 30px 16px 24px; border-radius: 0; }

</style>

<body>

</button>

<script>
  // ── Módulos visibles por dispositivo (localStorage) ─────────────
  // (hub v59) g: neg = arco de la izquierda (negocio), adm = arco de la derecha (administración)
  const HUB_MODULOS = [
    { id: 'crm',        nombre: 'Clientes',      desc: 'Pedidos · Clientes · WhatsApp',            icono: 'ti-shopping-bag',    color: 'crm',       g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/crm-adorno/' },
    { id: 'rrhh',       nombre: 'Colaboradores', desc: 'Empleadas · Sueldos · Asistencias',        icono: 'ti-users',           color: 'rrhh',      g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/rrhh-adorno/' },
    { id: 'ventas',     nombre: 'Ventas',        desc: 'Carga diaria · Cierre del día',            icono: 'ti-currency-dollar', color: 'ventas',    g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/ventas-adorno/' },
    { id: 'tesoreria',  nombre: 'Tesorería',     desc: 'Cajas · Bancos · MP · PPI',                icono: null,                 color: 'banco',     g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/tesoreria-adorno/' },
    { id: 'stock',      nombre: 'Stock',         desc: 'Precios · Existencias · 3 locales',        icono: 'ti-package',         color: 'stock',     g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/stock-adorno/' },
    { id: 'documentos', nombre: 'Documentos',    desc: 'Auditoría firmados · OneDrive',            icono: 'ti-folder-search',   color: 'reportes',  g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/documentos-adorno/' },
    { id: 'compras',    nombre: 'Compras',       desc: 'Facturas · gastos · listados',             icono: 'ti-shopping-cart',   color: 'compras',   g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/compras-adorno/' },
    { id: 'gastos',     nombre: 'Gastos',        desc: 'Planilla por unidad · mes a mes',          icono: 'ti-notebook',        color: 'gastos',    g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/gastos-adorno/' },
    { id: 'impuestos',  nombre: 'Impuestos',     desc: 'IIBB · cargas · vencimientos',             icono: 'ti-building-bank',   color: 'impuestos', g: 'adm', url: 'https://claudiaadornosrl-prog.github.io/impuestos-adorno/' },
    { id: 'productos',  nombre: 'Productos',     desc: 'Ficha por artículo · juegos · proveedores', icono: 'ti-tags',           color: 'productos', g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/productos-adorno/' },
    { id: 'marketing',  nombre: 'Marketing',     desc: 'Redes · pauta · web · métricas',           icono: 'ti-speakerphone',    color: 'marketing', g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/marketing-adorno/' },
    { id: 'obra',       nombre: 'Obra',          desc: 'Local Martínez · tareas · presupuestos · pagos', icono: 'ti-hammer',    color: 'obra',      g: 'neg', url: 'https://claudiaadornosrl-prog.github.io/obra-adorno/' },
  ];
  // caja fuerte: dibujo propio estilo tabler (el set no tiene "safe")
  const _HUB_SAFE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/><circle cx="12" cy="11" r="3.2"/><path d="M12 6.2v1.6M12 14.2v1.6M7.2 11h1.6M15.2 11h1.6M6 19v2M18 19v2"/></svg>';
  // moneda gruesa: discos de 1 px apilados (el canto) y una cara adelante y otra atrás con el ícono
  function _hubMoneda(ic, chico) {
    const T = chico ? 8 : 12; let capas = '';
    for (let i = 0; i < T; i++) capas += `<span class="canto${i % 2 ? ' b' : ''}" style="transform:translateZ(${(i - (T - 1) / 2).toFixed(1)}px);"></span>`;
    return `<span class="moneda">${capas}<span class="cara" style="transform:translateZ(${T / 2}px);">${ic}</span>` +
      `<span class="cara" style="transform:rotateY(180deg) translateZ(${T / 2}px);">${ic}</span></span><span class="piso"></span>`;
  }
  function _hubMonedas() {
    const esc = document.getElementById('escena'); if (!esc) return;
    const chico = esc.clientWidth > 0 && esc.clientWidth < 620;
    esc.dataset.chico = chico ? '1' : '0'; esc.classList.toggle('chico', chico);
    esc.querySelectorAll('.mod').forEach(m => m.remove());
    esc.insertAdjacentHTML('beforeend', HUB_MODULOS.map(m => {
      const ic = m.icono ? `<i class="ti ${m.icono}" aria-hidden="true"></i>` : _HUB_SAFE;
      return `<a class="mod" href="${m.url}" data-m="${m.id}" style="--c:var(--${m.color});" title="${m.nombre} · ${m.desc}" draggable="false">` +
        `<span class="bola">${_hubMoneda(ic, chico)}</span><span class="nom">${m.nombre}</span></a>`;
    }).join(''));
  }
  _hubMonedas();
  function hubOcultos() {
    try { return JSON.parse(localStorage.getItem('hub_modulos_ocultos') || '[]'); }
    catch { return []; }
  }
  // ── Módulos según el PERFIL del usuario (3-oct-2026, JP) ───────────
  //  La base dice qué módulos puede usar quien está logueado (hub_modulos():
  //  reutiliza los permisos de cada módulo). Sin sesión se ven todos: cada
  //  módulo pide usuario al entrar. Se recuerda por usuario para que no
  //  parpadee al abrir.
  // (14-oct-2026, JP) Sin sesión NO se muestra todo: solo los módulos de uso general. Los de Oficina
  // (Compras, Gastos, Impuestos) aparecen recién cuando la base confirma que ese usuario los tiene.
  const HUB_SIN_SESION = ['crm', 'rrhh', 'ventas', 'tesoreria', 'stock', 'documentos', 'productos'];
  let HUB_PERMITIDOS = HUB_SIN_SESION;
  function _hubPermCache(email, lista) {
    try {
      if (lista) localStorage.setItem('hub_modulos_perfil', JSON.stringify({ email, lista }));
      else { const c = JSON.parse(localStorage.getItem('hub_modulos_perfil') || 'null'); return c && c.email === email ? c.lista : null; }
    } catch (_) { return null; }
  }
  async function cargarPerfilModulos() {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { HUB_PERMITIDOS = HUB_SIN_SESION; aplicarVisibilidad(); return; }
      const email = (session.user.email || '').toLowerCase();
      const cache = _hubPermCache(email);
      HUB_PERMITIDOS = cache || HUB_SIN_SESION; aplicarVisibilidad();
      let { data, error } = await sb.rpc('hub_modulos');
      if (error || !data || !Array.isArray(data.modulos)) {   // un reintento si la red falló
        await new Promise(r => setTimeout(r, 1500));
        ({ data, error } = await sb.rpc('hub_modulos'));
        if (error || !data || !Array.isArray(data.modulos)) return;
      }
      HUB_PERMITIDOS = data.modulos; _hubPermCache(email, data.modulos);
      aplicarVisibilidad();
    } catch (_) {}
  }
  const _hubPermitido = id => !HUB_PERMITIDOS || HUB_PERMITIDOS.includes(id);
  function aplicarVisibilidad() {
    const ocultos = hubOcultos();
    document.querySelectorAll('.mod[data-m]').forEach(c =>
      c.classList.toggle('oculto', ocultos.includes(c.dataset.m) || !_hubPermitido(c.dataset.m)));
    if (typeof acomodarHub === 'function') acomodarHub();   // (hub v59) los arcos se rearman con las monedas que quedan
  }
  function abrirConfig() {
    const ocultos = hubOcultos();
    document.getElementById('config-rows').innerHTML = HUB_MODULOS.filter(m => _hubPermitido(m.id)).map(m => `
      <label class="config-row">
        <input type="checkbox" data-mod="${m.id}" ${ocultos.includes(m.id) ? '' : 'checked'}
               onchange="toggleModulo('${m.id}', this.checked)">
        <span class="nombre">${m.nombre}</span>
      </label>`).join('');
    document.getElementById('config-overlay').classList.add('open');
  }
  function toggleModulo(id, visible) {
    let ocultos = hubOcultos().filter(x => x !== id);
    if (!visible) ocultos.push(id);
    localStorage.setItem('hub_modulos_ocultos', JSON.stringify(ocultos));
    aplicarVisibilidad();
  }
  function cerrarConfig() { document.getElementById('config-overlay').classList.remove('open'); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarConfig(); });
  aplicarVisibilidad();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(err =>
        console.warn('[SW] no se pudo registrar:', err)
      );
    });
  }

  // ═══════════════════════════════════════════════════════════════
  //  CENTRO DE NOTIFICACIONES

    if (t && t.type === 'password' && typeof e.getModifierState === 'function') {

const _TILT = 20, _VUELTA = 1500;
const _rot = a => `rotateX(${_TILT}deg) rotateY(${a}deg)`;
function _anguloActual(m) {
  const g = m._giro; if (!g) return m._ang || 0;
  if (g.tipo === 'gira') return g.desde + ((g.anim.currentTime || 0) % _VUELTA) / _VUELTA * 360;
  const p = g.anim.effect.getComputedTiming().progress;
  return g.desde + (g.hasta - g.desde) * (p == null ? 1 : p);
}
function girar(m, on) {
  const mon = m && m.querySelector('.moneda'); if (!mon || !mon.animate || _quieto()) return;
  if (on) {

    const a = _anguloActual(m) % 360;
    if (m._giro) m._giro.anim.cancel();
    m._giro = { tipo: 'gira', desde: a, anim: mon.animate([{ transform: _rot(a) }, { transform: _rot(a + 360) }], { duration: _VUELTA, iterations: Infinity }) };
  } else if (m._giro && m._giro.tipo === 'gira') {
    const a = _anguloActual(m); m._giro.anim.cancel();
    let hasta = (Math.floor(a / 180) + 1) * 180;   // las dos caras tienen el ícono
    if (hasta - a < 100) hasta += 180;
    const dur = Math.max(800, Math.min(1100, (hasta - a) / 360 * _VUELTA * 2));
    mon.style.transform = _rot(hasta % 360);
    const anim = mon.animate([{ transform: _rot(a) }, { transform: _rot(hasta) }], { duration: dur, easing: 'cubic-bezier(.33, .66, .5, 1)' });
    m._giro = { tipo: 'frena', desde: a, hasta, anim };
    anim.onfinish = () => { if (m._giro && m._giro.anim === anim) { m._giro = null; m._ang = hasta % 360; } };

}

async function cargarTablero() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      _tbData = null; _salud = null; document.body.classList.remove('con-tablero');
      try { localStorage.removeItem('hub_con_tablero'); } catch (_) {}
      renderCentro(); return;
    }
    cargarSalud();   // el health check va siempre, compu y celular (solo JP)
    if (_tbChica.matches) { document.body.classList.remove('con-tablero'); renderCentro(); return; }
    let antes = false; try { antes = localStorage.getItem('hub_con_tablero') === '1'; } catch (_) {}
    if (!_tbData && antes) { document.body.classList.add('con-tablero'); renderCentro(); }   // esqueleto mientras llega la data
    if (_tbDolar == null) await _tbCotizacion();
    if (!_tbData) await _traerSlots();
    const { data, error } = await sb.rpc('hub_tablero');
    if (error || !data) { _tbData = null; document.body.classList.remove('con-tablero'); renderCentro(); return; }
    const primera = !_tbData; _tbData = data;
    document.body.classList.add('con-tablero');
    if (!primera) await _resumenesVisibles(false);
    _tbAnimar = primera; renderCentro(); _tbAnimar = true;   // al refrescar cada 5 min no vuelve a hacer las animaciones
    if (primera) _resumenesVisibles(true);
    try { localStorage.setItem('hub_con_tablero', '1'); } catch (_) {}
    if (!_tbTimer) _tbTimer = setInterval(cargarTablero, 5 * 60 * 1000);
  } catch (e) { console.warn('[tablero]', e); }
}

  const s = _hubSlots(), actual = s[slot];
  return `<div class="selector"><div class="sel-tit">Mostrar en este lugar:</div><div class="sel-grid">` +
    HUB_MODULOS.filter(m => _hubPermitido(m.id)).map(m => {
      const ok = FICHAS_CON_DATOS.includes(m.id), usada = s.includes(m.id) && m.id !== actual;
      return `<button type="button" class="sel-op ${m.id === actual ? 'actual' : ''}" data-elegir="${m.id}" ${ok ? '' : 'disabled'} title="${ok ? (usada ? 'Ya está en otra ficha: se intercambian de lugar' : m.nombre) : 'Su ficha todavía no está lista'}">` +
        `<span class="sel-bola" style="--c:var(--${m.color});">${_icono(m.id)}</span>${m.nombre}${ok ? '' : '<small>pronto</small>'}</button>`;
    }).join('') + `</div><div class="sel-pie"><span>Queda guardado en tu usuario. También podés arrastrar una moneda arriba de la ficha.</span><a data-restaurar>volver a las de siempre</a></div></div>`;
}
function _ponerFicha(slot, id) {
  if (!FICHAS_CON_DATOS.includes(id)) return;
  const s = _hubSlots(), j = s.indexOf(id);
  if (j === slot) { _cerrarSelector(); return; }
  if (j >= 0) s[j] = s[slot];   // si ya estaba en otra ficha, se intercambian de lugar
  s[slot] = id;
  _guardarSlots(s);
  renderCentro();
  if (!_res[id] && !BASE_TABLERO.includes(id)) _resumenesVisibles(true);
}
(function () {
  const esc = document.getElementById('escena'); if (!esc) return;
  esc.addEventListener('click', e => {
    const cambiar = e.target.closest('.fz-cambiar'), elegir = e.target.closest('[data-elegir]'), med = e.target.closest('.medallon.salud');
    if (cambiar) {
      const f = cambiar.closest('.fz'), abierto = f.classList.contains('eligiendo');
      _cerrarSelector();
      if (!abierto) { f.classList.add('eligiendo'); f.insertAdjacentHTML('beforeend', _selectorHTML(+cambiar.dataset.slot)); }
      return;
    }
    if (elegir) { _ponerFicha(+elegir.closest('.fz').dataset.slot, elegir.dataset.elegir); return; }
    if (e.target.closest('[data-restaurar]')) { _guardarSlots(FICHAS_BASE.slice()); renderCentro(); return; }
    if (med) { const ab = esc.querySelector('.sal-detalle'); if (ab) ab.remove(); else med.insertAdjacentHTML('afterend', saludDetalleHTML()); return; }
    const sal = e.target.closest('[data-sal]'); if (sal) { _salAccion(sal.dataset.sal, sal); return; }
    if (!e.target.closest('.sal-detalle')) esc.querySelectorAll('.sal-detalle').forEach(x => x.remove());
    if (!e.target.closest('.selector')) _cerrarSelector();
  });
  esc.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.medallon.salud')) { e.preventDefault(); e.target.click(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { _cerrarSelector(); esc.querySelectorAll('.sal-detalle').forEach(x => x.remove()); } });
  // arrastrar una moneda arriba de una ficha
  let arrastrando = null;
  esc.addEventListener('dragstart', e => {
    const m = e.target.closest && e.target.closest('.mod'); if (!m || !m.draggable) return;
    arrastrando = m.dataset.m; girar(m, false);
    e.dataTransfer.setData('text/plain', arrastrando); e.dataTransfer.effectAllowed = 'copy';
    try { e.dataTransfer.setDragImage(m.querySelector('.bola'), m.offsetWidth / 2, m.offsetHeight / 2); } catch (_) {}
  });
  esc.addEventListener('dragover', e => {
    const f = e.target.closest && e.target.closest('.fz[data-slot]'); if (!f || !arrastrando) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'copy';
    if (!f.classList.contains('soltar')) {
      esc.querySelectorAll('.soltar').forEach(x => x.classList.remove('soltar'));
      f.dataset.soltar = _hubSlots()[+f.dataset.slot] === arrastrando ? `${_hubMod(arrastrando).nombre} ya está acá` : `Soltá para ver ${_hubMod(arrastrando).nombre} acá`;
      f.classList.add('soltar');
    }
  });
  esc.addEventListener('dragleave', e => { const f = e.target.closest && e.target.closest('.fz.soltar'); if (f && !f.contains(e.relatedTarget)) f.classList.remove('soltar'); });
  esc.addEventListener('drop', e => {
    const f = e.target.closest && e.target.closest('.fz[data-slot]'); if (!f || !arrastrando) return;
    e.preventDefault(); const id = arrastrando; arrastrando = null; _ponerFicha(+f.dataset.slot, id);
  });
  esc.addEventListener('dragend', () => { arrastrando = null; esc.querySelectorAll('.soltar').forEach(x => x.classList.remove('soltar')); });
  // pasar el mouse por una moneda ilumina su ficha (y al revés) y la moneda gira; al entrar a una ficha, repite su animación
  let marcado = null, girando = null, fichaActual = null;
  esc.addEventListener('mouseover', e => {
    const t = e.target.closest('.mod[data-m], .fz[data-f]'), id = t ? (t.dataset.m || t.dataset.f) : null;
    if (id !== marcado) {
      marcado = id;
      esc.querySelectorAll('.luz').forEach(x => x.classList.remove('luz'));
      const m = id ? esc.querySelector(`.mod[data-m="${id}"]`) : null;
      if (girando && girando !== m) { girar(girando, false); girando = null; }
      if (id) { esc.querySelectorAll(`.mod[data-m="${id}"], .fz[data-f="${id}"]`).forEach(x => x.classList.add('luz')); if (m) { girar(m, true); girando = m; } }
    }
    const fz = e.target.closest('.fz');
    if (fz && fz !== fichaActual && !e.target.closest('.selector') && !_quieto() && (!fz._t || performance.now() - fz._t > 2500)) {
      fz._t = performance.now(); fz.classList.add('re'); void fz.offsetWidth; fz.classList.remove('re'); _contar(fz);
    }
    fichaActual = fz;
  });
  esc.addEventListener('mouseleave', () => {
    marcado = null; fichaActual = null; esc.querySelectorAll('.luz').forEach(x => x.classList.remove('luz'));
    if (girando) { girar(girando, false); girando = null; }
  });
  let tRes = null;
  addEventListener('resize', () => { clearTimeout(tRes); tRes = setTimeout(acomodarHub, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(acomodarHub);
})();
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { try { localStorage.removeItem('hub_fichas'); } catch (_) {} setTimeout(cargarTablero, 50); } });
renderCentro();
cargarTablero();

(async function _autoResubPush() {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
    const { data: { session: _s } } = await sb.auth.getSession();
    if (!_s) return;
    let _emp = null, _gen = null;
    try {
      const { data: u } = await sb.rpc('rrhh_current_user');
      const _u = Array.isArray(u) ? u[0] : u;
      _emp = _u?.empleado_id ?? null;
      if (!_emp) _gen = _u?.local_gerencia ?? null;
    } catch (_) {}
    if (!_emp && !_gen) {
      const _GEN = { 'administracion@claudiaadorno.com': 'oficina',
                     'claudiaadorno@claudiaadorno.com': 'oficina' };
      _gen = _GEN[(_s.user?.email || '').toLowerCase()] || null;
    }
    if (!_emp && !_gen) return;
    let q = sb.from('rrhh_push_subscriptions').select('app')
      .eq('plataforma', 'hub');
    q = _emp ? q.eq('empleado_id', _emp) : q.eq('local_generico', _gen);
    const { data: filas } = await q;
    const apps = [...new Set((filas || []).map(r => r.app))];
    if (!apps.length) return;
    const reg = await navigator.serviceWorker.ready;
    let sub = await _getSubFresca(reg);
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlB64ToUint8(VAPID_PUBLIC_KEY),
      });
    }
    const raw = sub.toJSON();
    for (const app of apps) {
      const payload = {
        endpoint: raw.endpoint, p256dh: raw.keys.p256dh, auth: raw.keys.auth,
        app, activa: true, plataforma: 'hub',
        user_agent: (navigator.userAgent || '').slice(0, 200),
        last_seen_at: new Date().toISOString(),
      };
      if (_emp) payload.empleado_id = _emp; else payload.local_generico = _gen;
      await sb.from('rrhh_push_subscriptions').upsert(payload, { onConflict: 'endpoint,app' });
    }
    document.getElementById('notif-btn')?.classList.add('activo');
  } catch (_) {}
})();
