<h1>Clodi en vivo</h1>
<p>Vista previa del movimiento: parpadea cada tanto, de vez en cuando hace un gesto con la cabeza y, cuando habla, mueve la boca.
Abajo a la derecha está como se ve en los módulos (en el celular, la cara redonda; en la PC, el busto).</p>

<div class="bts"><button class="b" id="hablar">Que hable</button><button class="b sec" id="parar">Parar</button></div>
</main>

  function armar() {

    panel.addEventListener('click', (e) => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a;

  function dictar() {

    rec.onresult = (ev) => { let interim = ''; for (let i = ev.resultIndex; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) final += r[0].transcript; else interim += r[0].transcript; } ta.value = (final + interim).trim(); };
    rec.onerror = (ev) => { grabando = false; btn.classList.remove('on'); ta.placeholder = 'Preguntale a Clodi…'; if (ev.error !== 'aborted' && ev.error !== 'no-speech') log('err', ev.error === 'not-allowed' ? 'El navegador no dio permiso para usar el micrófono.' : 'No pude escuchar (' + ev.error + '). Escribí la pregunta.'); };

  // (28-oct, JP: "una voz que sea la más parecida a la de Claudia") mujer, argentina primero. Cada equipo tiene voces distintas:
  // se usa la primera de esta lista que exista; la persona puede elegir otra en el panel (queda guardada en ese equipo).
  // (28-oct) Voz elegida por JP con la galería (hub/voces.html), una por sistema, todas a velocidad 1.1:

  const PREFERIDAS = ['helena', 'laura', 'elvira', 'mónica', 'monica', 'google español', 'elena', 'dalia', 'paloma', 'sabina', 'paulina', 'google español de estados unidos'];
  const AJUSTES = { pc: { velocidad: 1.1, tono: 1.0 }, ios: { velocidad: 1.1, tono: 0.7 }, android: { velocidad: 1.1, tono: 1.1 } };
  function plataforma() {
    const ua = navigator.userAgent || '';

    if (pl === 'ios') { const v = vs.find((x) => /paulina/i.test(x.name)) || vs.find((x) => /m[oó]nica/i.test(x.name)); if (v) return v; }
    if (pl === 'android') { const us = vs.filter((x) => /^es[-_]us$/i.test(x.lang)); if (us.length) return us.find((x) => x.localService) || us[0]; }
    // palabra entera: "helena" no es "elena"
    const pts = (v) => { const n = v.name.toLowerCase(); const i = PREFERIDAS.findIndex((p) => new RegExp('(^|[^a-záéíóúñ])' + p + '($|[^a-záéíóúñ])').test(n)); return (i < 0 ? 0 : 100 - i * 5) + (v.lang === 'es-AR' ? 30 : 0) + (v.localService ? 0 : 2); };

  const reducido = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) { return false; } };

  }
  function gestoCabeza() {   // un gesto suelto (inclinar, asentir o girar apenas) y vuelve; nunca igual dos veces
    const r = Math.random(), s = Math.random() < .5 ? -1 : 1;

      : `translateX(${(s * (1 + Math.random())).toFixed(1)}%) rotate(${(s * (1 + Math.random() * 1.5)).toFixed(1)}deg)`;

  async function prepararAccion(acc, porVoz) {   // completa el formulario del módulo; se envía SOLO con el botón Enviar

  async function enviar(porVoz) {

})();
